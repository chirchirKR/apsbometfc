<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f0ff">
  <title>Reset password · APS Bomet FC</title><link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="auth-shell">
    <section class="auth-card" aria-labelledby="page-title">
      <a class="brand" href="index.html" aria-label="Loop home">
        <span class="brand-mark"><span></span></span>
        <span><strong>APS BOMET FC</strong><small>Ng'etundo ko Agenge</small></span>
      </a>
      <nav class="auth-tabs single-tab" aria-label="Account pages"><a class="active" href="login.html">Account access</a></nav>
      <a class="back-link" href="login.html">← Back to log in</a>
      <h1 id="page-title">Forgot your password?</h1>
      <p class="intro-copy">No worries. Enter the email address linked to your account and we’ll help you get back in.</p>
      <form id="reset-form" novalidate>
        <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required></div>
        <p class="form-message" id="reset-message" role="status"></p>
        <button class="primary-btn" type="submit">Send reset link</button>
      </form>
      <p class="switch-copy">Remembered your password? <a href="login.html">Log in</a></p>
      <p class="demo-note">All Rights Reservered | &copy;2027</p>
    </section>
  </main>
  <script src="js/auth.js"></script>
</body></html>
