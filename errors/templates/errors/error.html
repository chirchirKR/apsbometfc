{% load static %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>{{ code }} · {{ title }}</title>
    <link rel="stylesheet" href="{% static 'errors/css/error.css' %}">
</head>
<body>
    <main class="error-shell">
        <section class="error-card" aria-labelledby="error-title">
            <div class="error-symbol" aria-hidden="true">{{ symbol }}</div>
            <p class="eyebrow">OOPS! SOMETHING HAPPENED</p>
            <div class="error-code">{{ code }}</div>
            <h1 id="error-title">{{ title }}</h1>
            <p class="error-message">{{ message }}</p>

            <div class="error-actions">
                <a class="button button-primary" href="/">Go to homepage</a>
                <button class="button button-secondary" type="button"
                        onclick="if (history.length > 1) { history.back(); } else { window.location.href='/'; }">
                    Go back
                </button>
            </div>

            <p class="error-footnote">If the problem continues, please contact support.</p>
        </section>
    </main>
</body>
</html>
