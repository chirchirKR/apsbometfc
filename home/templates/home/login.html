<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f0ff">
  <title>Log in · APS Bomet FC</title><link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="auth-shell">
    <section class="auth-card" aria-labelledby="page-title">
      <a class="brand" href="index.html" aria-label="Loop home">
        <span class="brand-mark"><span></span></span>
        <span><strong>APS BOMET FC</strong><small>Ng'etundo ko Agenge</small></span>
      </a>
      <nav class="auth-tabs" aria-label="Account pages">
        <a class="active" href="login.html" aria-current="page">Log in</a><a href="index.html">Create account</a>
      </nav>
      <h1 id="page-title">Welcome back</h1>
      <p class="intro-copy">Pick up where you left off.</p>
      <form id="login-form" novalidate>
        <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required></div>
        <div class="field">
          <div class="label-line"><label for="password">Password</label><a href="forgot-password.html">Forgot password?</a></div>
          <div class="password-wrap"><input id="password" name="password" type="password" autocomplete="current-password" required><button class="eye-btn" type="button" data-toggle-password="password" aria-label="Show password"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.4-6 9.5-6 9.5 6 9.5 6-3.4 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="2.8"/></svg></button></div>
        </div>
        <p class="form-message" id="login-message" role="status"></p>
        <button class="primary-btn" type="submit">Log in</button>
      </form>
      <p class="switch-copy">Am new Here? <a href="index.html">Create an account</a></p>
      <p class="demo-note">All Rights Reserved | &copy;2027 </p>
    </section>
  </main>
  <script src="js/auth.js"></script>
</body></html>
